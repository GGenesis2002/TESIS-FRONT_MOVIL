name: lab_cardenas_garofalo
description: Laboratorio Clínico Cárdenas-Garofalo
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.2.1
  shared_preferences: ^2.2.2
  pin_code_fields: ^8.0.1
  qr_flutter: ^4.1.0
  url_launcher: ^6.3.2
  flutter_pdfview: ^1.3.2
  path_provider: ^2.1.5
  share_plus: ^10.0.2
  open_filex: ^4.4.0
  flutter_secure_storage: ^9.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: "^0.13.1" # Añade esta línea

flutter:
  uses-material-design: true
  assets:
    - assets/logoLab.png

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logoLab.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/logoLab.png"